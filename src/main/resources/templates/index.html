<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Феи Винкс — Рулетка</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9ec7, #a78bfa, #6ee7ff);
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: white;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            margin-top: 0;
            font-size: 32px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }

        #result {
            margin: 20px 0;
            min-height: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .fairy-card {
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.6), 0 8px 20px rgba(0, 0, 0, 0.3);
            animation: pop 0.5s ease-out;
            transition: box-shadow 0.3s;
        }

        .fairy-card.rolling {
            animation: shake 0.15s infinite;
        }

        .fairy-card.legendary {
            box-shadow: 0 0 50px #fde047, 0 0 100px #fde047, 0 8px 20px rgba(0, 0, 0, 0.4);
            animation: pop 0.5s ease-out, glow 1.5s ease-in-out infinite alternate;
        }

        .fairy-card.rare {
            box-shadow: 0 0 40px #60a5fa, 0 0 80px #60a5fa, 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .fairy-card img {
            width: 200px;
            height: 260px;
            object-fit: contain;
            border-radius: 12px;
            display: block;
        }

        .fairy-name {
            margin-top: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #a855f7;
        }

        .fairy-rarity {
            margin-top: 5px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 3px 10px;
            border-radius: 12px;
            display: inline-block;
        }

        .rarity-common     { background: #e5e7eb; color: #6b7280; }
        .rarity-uncommon   { background: #d1fae5; color: #065f46; }
        .rarity-rare       { background: #dbeafe; color: #1e40af; }
        .rarity-legendary  { background: #fef3c7; color: #92400e; }

        .fairy-prize {
            margin-top: 12px;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
        }

        .duplicate-bonus {
            margin-top: 5px;
            font-size: 16px;
            color: #fde047;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
        }

        .placeholder {
            font-size: 22px;
            opacity: 0.9;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: white;
            color: #a855f7;
            border: none;
            border-radius: 50px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stats {
            margin-top: 20px;
            font-size: 16px;
            opacity: 0.95;
        }

        .collection {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 14px;
            text-align: left;
        }

        .collection h3 {
            margin: 0 0 10px 0;
            text-align: center;
            font-size: 18px;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #fde047, #fbbf24);
            border-radius: 10px;
            transition: width 0.6s ease-out;
            box-shadow: 0 0 10px #fde047;
        }

        .collection-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
        }

        .collection-item.collected {
            color: #fde047;
            font-weight: bold;
        }

        .collection-item.not-collected {
            opacity: 0.5;
        }

        .history {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 14px;
            text-align: left;
        }

        .history h3 {
            margin: 0 0 10px 0;
            text-align: center;
            font-size: 18px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            opacity: 0.9;
        }

        .history-item .name {
            font-weight: bold;
        }

        .history-item .time {
            opacity: 0.6;
            font-size: 12px;
        }

        .history-item.duplicate .name::after {
            content: " (дубликат)";
            font-size: 11px;
            opacity: 0.7;
            font-weight: normal;
        }

        .new-fairy-toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-200%);
            background: linear-gradient(135deg, #fde047, #fbbf24);
            color: #78350f;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 10px 40px rgba(251, 191, 36, 0.7), 0 0 60px rgba(253, 224, 71, 0.6);
            z-index: 1000;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            white-space: nowrap;
        }

        .new-fairy-toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @keyframes pop {
            0%   { transform: scale(0.3); opacity: 0; }
            70%  { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%   { transform: translateX(-3px); }
            50%  { transform: translateX(3px); }
            100% { transform: translateX(-3px); }
        }

        @keyframes glow {
            from { box-shadow: 0 0 50px #fde047, 0 0 100px #fde047, 0 8px 20px rgba(0, 0, 0, 0.4); }
            to   { box-shadow: 0 0 70px #fbbf24, 0 0 140px #fbbf24, 0 8px 20px rgba(0, 0, 0, 0.4); }
        }
    </style>
</head>
<body>
<canvas id="confettiCanvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999;"></canvas>

<div class="new-fairy-toast" id="newFairyToast">🎉 НОВАЯ ФЕЯ! 🎉</div>

<div class="container">
    <h1>✨ Феи Винкс ✨</h1>
    <div id="result">
        <div class="placeholder">Загрузка...</div>
    </div>
    <div class="buttons">
        <button id="spinBtn" onclick="spin()">Крутить</button>
        <button id="buyBtn" onclick="buyTicket()">Купить билет (50 искр)</button>
    </div>
    <div class="stats" id="stats">Загрузка...</div>

    <div class="collection" id="collection"></div>
    <div class="history" id="history"></div>
</div>

<script>
    const fairies = ["Лейла", "Текна", "Муза", "Флора", "Стелла", "Блум"];
    const images  = ["layla.jpg", "tecna.jpg", "musa.jpg", "flora.jpg", "stella.jpg", "bloom.webp"];
    const rarities = ["common", "common", "uncommon", "uncommon", "rare", "legendary"];
    const rarityNames = {
        common: "Обычная",
        uncommon: "Необычная",
        rare: "Редкая",
        legendary: "Легендарная"
    };

    const MAX_TICKETS = 10;

    let spinning = false;

    async function fetchState() {
        const response = await fetch("/api/state");
        return await response.json();
    }

    async function fetchSpin() {
        const response = await fetch("/api/spin", { method: "POST" });
        return await response.json();
    }

    async function fetchBuy() {
        const response = await fetch("/api/buy", { method: "POST" });
        return await response.json();
    }

    function updateStats(state) {
        document.getElementById("stats").textContent =
            "Билетов: " + state.tickets + " | Искр: " + state.sparks;
        document.getElementById("buyBtn").disabled = state.tickets >= MAX_TICKETS || spinning;
        document.getElementById("spinBtn").disabled = spinning;
    }

    function updateCollection(state) {
        let collected = 0;
        for (let i = 0; i < fairies.length; i++) {
            if (state.fairyCounts[i] > 0) collected++;
        }

        const percent = (collected / fairies.length) * 100;

        let html = "<h3>Коллекция</h3>";
        html += "<div class='progress-bar'><div class='progress-fill' style='width: " + percent + "%'></div></div>";

        for (let i = 0; i < fairies.length; i++) {
            if (state.fairyCounts[i] > 0) {
                html += "<div class='collection-item collected'><span>" + fairies[i] + "</span><span>" + state.fairyCounts[i] + " раз</span></div>";
            } else {
                html += "<div class='collection-item not-collected'><span>" + fairies[i] + "</span><span>не выпадала</span></div>";
            }
        }
        html += "<div style='text-align:center; margin-top:10px;'>Собрано: " + collected + "/" + fairies.length + "</div>";
        document.getElementById("collection").innerHTML = html;
    }

    function updateHistory(state) {
        if (!state.history || state.history.length === 0) {
            document.getElementById("history").innerHTML =
                "<h3>Последние крутки</h3><div style='text-align:center; opacity:0.6;'>Пока пусто</div>";
            return;
        }

        let html = "<h3>Последние крутки</h3>";
        for (let i = 0; i < state.history.length; i++) {
            const record = state.history[i];
            const fairyName = fairies[record.fairyIndex];
            const timeStr = timeAgo(record.timestamp);
            const dupClass = record.duplicate ? "duplicate" : "";
            html += "<div class='history-item " + dupClass + "'>" +
                "<span class='name'>" + fairyName + "</span>" +
                "<span>+" + record.prize + " искр <span class='time'>" + timeStr + "</span></span>" +
                "</div>";
        }
        document.getElementById("history").innerHTML = html;
    }

    function timeAgo(timestamp) {
        const seconds = Math.floor((Date.now() - timestamp) / 1000);
        if (seconds < 5) return "только что";
        if (seconds < 60) return seconds + " сек назад";
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return minutes + " мин назад";
        const hours = Math.floor(minutes / 60);
        return hours + " ч назад";
    }

    function showFairyCard(index, prize, duplicate) {
        const cardClass = rarities[index] === "legendary" ? "legendary" :
            rarities[index] === "rare" ? "rare" : "";

        let bonusHtml = duplicate
            ? "<div class='duplicate-bonus'>Дубликат! Бонус +10 искр</div>"
            : "";

        document.getElementById("result").innerHTML =
            "<div class='fairy-card " + cardClass + "'>" +
            "<img src='" + images[index] + "' alt='" + fairies[index] + "'>" +
            "<div class='fairy-name'>" + fairies[index] + "</div>" +
            "<div class='fairy-rarity rarity-" + rarities[index] + "'>" + rarityNames[rarities[index]] + "</div>" +
            "</div>" +
            "<div class='fairy-prize'>+" + prize + " искр</div>" +
            bonusHtml;
    }

    function showNewFairyToast() {
        const toast = document.getElementById("newFairyToast");
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2200);
    }

    // ============ Звуки ============

    let audioCtx = null;

    function getAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioCtx;
    }

    function playTone(frequency, duration, type, volume, delay) {
        const ctx = getAudioContext();
        const oscillator = ctx.createOscillator();
        const gainNode = ctx.createGain();

        oscillator.type = type || "sine";
        oscillator.frequency.value = frequency;
        oscillator.connect(gainNode);
        gainNode.connect(ctx.destination);

        const startTime = ctx.currentTime + (delay || 0);
        gainNode.gain.setValueAtTime(0, startTime);
        gainNode.gain.linearRampToValueAtTime(volume || 0.1, startTime + 0.01);
        gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

        oscillator.start(startTime);
        oscillator.stop(startTime + duration);
    }

    function playNormalSound() {
        playTone(880, 0.15, "sine", 0.1, 0);
        playTone(1100, 0.2, "sine", 0.08, 0.08);
    }

    function playRareSound() {
        playTone(660, 0.15, "triangle", 0.1, 0);
        playTone(880, 0.15, "triangle", 0.1, 0.1);
        playTone(1320, 0.3, "triangle", 0.1, 0.2);
    }

    function playLegendarySound() {
        playTone(523, 0.2, "sine", 0.12, 0);
        playTone(659, 0.2, "sine", 0.12, 0.15);
        playTone(784, 0.2, "sine", 0.12, 0.3);
        playTone(1047, 0.5, "sine", 0.15, 0.45);
    }

    function playDuplicateSound() {
        playTone(440, 0.15, "square", 0.06, 0);
        playTone(330, 0.25, "square", 0.06, 0.12);
    }

    // ============ Конфетти ============

    const canvas = document.getElementById("confettiCanvas");
    const ctx2d = canvas.getContext("2d");
    let confettiParticles = [];
    let confettiAnimation = null;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    function launchConfetti(colors) {
        confettiParticles = [];
        for (let i = 0; i < 120; i++) {
            confettiParticles.push({
                x: canvas.width / 2 + (Math.random() - 0.5) * 200,
                y: canvas.height / 2,
                vx: (Math.random() - 0.5) * 12,
                vy: Math.random() * -12 - 4,
                size: Math.random() * 8 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.3,
                life: 1
            });
        }
        if (!confettiAnimation) {
            animateConfetti();
        }
    }

    function animateConfetti() {
        ctx2d.clearRect(0, 0, canvas.width, canvas.height);

        let alive = false;
        for (const p of confettiParticles) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.35;
            p.vx *= 0.99;
            p.rotation += p.rotationSpeed;
            p.life -= 0.008;

            if (p.life > 0 && p.y < canvas.height + 50) {
                alive = true;
                ctx2d.save();
                ctx2d.globalAlpha = Math.max(0, p.life);
                ctx2d.translate(p.x, p.y);
                ctx2d.rotate(p.rotation);
                ctx2d.fillStyle = p.color;
                ctx2d.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx2d.restore();
            }
        }

        if (alive) {
            confettiAnimation = requestAnimationFrame(animateConfetti);
        } else {
            ctx2d.clearRect(0, 0, canvas.width, canvas.height);
            confettiAnimation = null;
            confettiParticles = [];
        }
    }

    // ============ Крутка ============

    async function spin() {
        if (spinning) return;

        const stateBefore = await fetchState();
        if (stateBefore.tickets <= 0) {
            document.getElementById("result").innerHTML =
                "<div class='placeholder'>Билетов нет!<br>Купи билет или подожди.</div>";
            return;
        }

        spinning = true;
        updateStats(stateBefore);

        const flashInterval = setInterval(() => {
            const randomIndex = Math.floor(Math.random() * fairies.length);
            document.getElementById("result").innerHTML =
                "<div class='fairy-card rolling'>" +
                "<img src='" + images[randomIndex] + "' alt='rolling'>" +
                "</div>";
        }, 100);

        setTimeout(async () => {
            clearInterval(flashInterval);

            const result = await fetchSpin();

            if (result.success) {
                showFairyCard(result.fairyIndex, result.prize, result.duplicate);

                const rarity = rarities[result.fairyIndex];

                if (result.duplicate) {
                    playDuplicateSound();
                } else if (rarity === "legendary") {
                    playLegendarySound();
                    launchConfetti(["#fde047", "#fbbf24", "#f59e0b", "#ffffff"]);
                } else if (rarity === "rare") {
                    playRareSound();
                    launchConfetti(["#60a5fa", "#93c5fd", "#3b82f6", "#ffffff"]);
                } else {
                    playNormalSound();
                }

                if (!result.duplicate) {
                    showNewFairyToast();
                }
            } else {
                document.getElementById("result").innerHTML =
                    "<div class='placeholder'>" + result.message + "</div>";
            }

            updateStats(result);
            updateCollection(result);
            updateHistory(result);
            spinning = false;
            updateStats(result);
        }, 1500);
    }

    async function buyTicket() {
        if (spinning) return;
        const result = await fetchBuy();
        updateStats(result);
        if (!result.success) {
            document.getElementById("result").innerHTML =
                "<div class='placeholder'>" + result.message + "</div>";
        }
    }

    async function init() {
        const state = await fetchState();
        document.getElementById("result").innerHTML =
            "<div class='placeholder'>Нажми кнопку, чтобы крутить!</div>";
        updateStats(state);
        updateCollection(state);
        updateHistory(state);
    }

    init();
</script>
</body>
</html>
